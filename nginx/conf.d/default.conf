# ═══════════════════════════════════════════════════════════════════════════
# GameVault Nginx Reverse Proxy Configuration
# ═══════════════════════════════════════════════════════════════════════════

# Upstream backend API
upstream api_backend {
    server api:5000;
}

# Upstream storefront
upstream storefront_backend {
    server storefront:80;
}

# Upstream admin panel
upstream admin_backend {
    server admin:80;
}

# ═══════════════════════════════════════════════════════════════════════════
# Main Server Block
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ───────────────────────────────────────────────────────────────────────
    # API Routes
    # ───────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health checks
    location /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Swagger UI (development only)
    location /swagger {
        proxy_pass http://api_backend/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ───────────────────────────────────────────────────────────────────────
    # Static Images
    # ───────────────────────────────────────────────────────────────────────
    location /images/ {
        alias /usr/share/nginx/html/images/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ───────────────────────────────────────────────────────────────────────
    # Admin Panel (subdomain or path-based routing)
    # ───────────────────────────────────────────────────────────────────────
    location /admin {
        proxy_pass http://admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ───────────────────────────────────────────────────────────────────────
    # Storefront (default/root)
    # ───────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://storefront_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA fallback
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
